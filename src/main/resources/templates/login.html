<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" th:href="@{/favicon.png}" />
  <title>TradingCrews:트루 | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #0369A1;
      --color-primary: var(--accent);
      --color-primary-dark: #0089A5;
      --color-border: #e2e8f0;
      --color-muted: #94a3b8;
      --color-text: #0f172a;
      --color-subtext: #64748b;
      --color-bg: #eef2f7;
      --color-surface: #ffffff;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      background-color: var(--color-bg);
      font-family: 'DM Sans', sans-serif;
      padding: 1.5rem;
    }

    /* ── 카드 ── */
    .card {
      display: flex;
      flex-direction: column;
      background: var(--color-surface);
      border-radius: 24px;
      padding: 10px;
      width: clamp(300px, 90vw, 780px);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.1);
    }

    /* ── 히어로 패널 ── */
    .hero {
      background: linear-gradient(135deg, #090E18 0%, #0E1620 45%, var(--accent) 100%);
      border-radius: 18px;
      overflow: hidden;
      position: relative;
    }

    .hero::before,
    .hero::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
    }

    .hero::before {
      width: 260px;
      height: 260px;
      top: -80px;
      right: -60px;
    }

    .hero::after {
      width: 160px;
      height: 160px;
      bottom: -40px;
      left: -30px;
    }

    .hero-inner {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 2rem 2.2rem;
      min-height: 180px;
      height: 100%;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 100px;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 14px;
      width: fit-content;
      backdrop-filter: blur(4px);
    }

    .hero-badge span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      display: inline-block;
    }

    .hero h2 {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.35;
      margin-bottom: 8px;
    }

    .hero p {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.6;
      display: none;
    }

    /* ── 폼 영역 ── */
    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 2rem 1.5rem;
    }

    .form-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--color-text);
      margin-bottom: 2px;
    }

    .form-subtitle {
      font-size: 13px;
      color: var(--color-subtext);
    }

    /* ── 인풋 필드 ── */
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 11px;
      font-weight: 600;
      color: var(--color-subtext);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    input {
      height: 46px;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      background: #f8fafc;
      padding: 0 14px;
      font-family: inherit;
      font-size: 14px;
      color: var(--color-text);
      outline: none;
      width: 100%;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    input::placeholder {
      color: var(--color-muted);
    }

    input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      background: #fff;
    }

    /* ── 에러 ── */
    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 500;
      color: #ef4444;
      text-align: center;
    }

    /* ── 제출 버튼 ── */
    button[type="submit"] {
      height: 46px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      letter-spacing: 0.02em;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
      transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
      margin-top: 2px;
    }

    button[type="submit"]:hover {
      background: var(--color-primary-dark);
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.45);
    }

    button[type="submit"]:active {
      transform: scale(0.98);
    }

    /* ── 하단 회원가입 링크 ── */
    .signup-text {
      text-align: center;
      font-size: 12px;
      color: var(--color-subtext);
    }

    .signup-text a {
      color: var(--color-primary);
      font-weight: 600;
      text-decoration: none;
    }

    .signup-text a:hover {
      text-decoration: underline;
    }

    /* ── 소셜 로그인 구분선 ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 8px 0;
      color: var(--color-muted);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }

    /* ── 소셜 버튼 ── */
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 46px;
      background: #ffffff;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      color: var(--color-text);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .social-btn:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      transform: translateY(-1px);
    }

    .social-btn svg {
      width: 18px;
      height: 18px;
    }

    /* ════════════════════════════════
       반응형
       ════════════════════════════════ */
    @media (min-width: 500px) {
      form {
        padding: 2rem 2.5rem;
      }

      .hero p {
        display: block;
      }
    }

    @media (min-width: 640px) {
      .card {
        flex-direction: row;
        padding: 10px 0 10px 10px;
      }

      .hero,
      form {
        flex: 1 1 50%;
      }

      .hero-inner {
        justify-content: center;
        padding: 2.5rem 2rem;
        min-height: 420px;
      }

      .hero p {
        display: block;
      }

      form {
        padding: 2.5rem 2.2rem;
      }
    }

    /* ── 로딩 오버레이 ── */
    #loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(14, 26, 58, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 20px;
      animation: fadeIn 0.2s ease;
    }

    #loading-overlay.show {
      display: flex;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .loading-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 36px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    /* 링 스피너 */
    .spinner {
      width: 52px;
      height: 52px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-title {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    .loading-sub {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 0.03em;
    }

    /* 버튼 로딩 상태 */
    button[type="submit"].loading {
      opacity: 0.7;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    button[type="submit"].loading::before {
      content: '';
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
  </style>
</head>

<body>

  <!-- ── 전체화면 로딩 오버레이 ── -->
  <div id="loading-overlay">
    <div class="loading-card">
      <div class="spinner"></div>
      <div>
        <p class="loading-title">로그인 중입니다...</p>
        <p class="loading-sub">잠시만 기다려 주세요</p>
      </div>
    </div>
  </div>
  <div class="card">

    <!-- ── 히어로 ── -->
    <div class="hero">
      <div class="hero-inner">
        <div class="hero-badge">
          <span></span> 실시간 시장 데이터
        </div>
        <h2>소중한 투자 크루,<br>TradingCrews와 함께</h2>
        <p>함께 성장하는 트레이딩 커뮤니티,<br>실시간 데이터와 인사이드를 공유하세요.</p>
      </div>
    </div>

    <!-- ── 로그인 폼 ── -->
    <form id="login-form" th:action="@{/login}" method="post">

      <div>
        <p class="form-title">TradingCrews<span style="color: #02A6C8;">:트루</span></p>
        <p class="form-subtitle">계정에 로그인하세요</p>
      </div>

      <div class="field">
        <label for="loginId">Login ID</label>
        <input type="text" id="loginId" name="loginId" required autocomplete="username" placeholder="아이디를 입력하세요" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password"
          placeholder="••••••••" />
      </div>

      <input type="hidden" name="redirectURL" th:value="${redirectURL}" th:if="${redirectURL != null}" />

      <!-- 로그인 실패 에러 (Thymeleaf) -->
      <div th:if="${param.error}" class="error-box">
        아이디 또는 비밀번호가 일치하지 않습니다.
      </div>

      <button type="submit">로그인하기</button>

      <div class="divider">또는</div>

      <a href="/oauth2/authorization/google" class="social-btn">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        구글 계정으로 시작하기
      </a>

      <p class="signup-text">
        계정이 없으신가요? <a href="/signup">회원가입</a>
      </p>

    </form>
  </div>
  <script>
    const form = document.getElementById('login-form');
    const overlay = document.getElementById('loading-overlay');
    const submitBtn = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', function () {
      // 버튼 로딩 상태
      submitBtn.classList.add('loading');
      submitBtn.textContent = '';
      submitBtn.insertAdjacentText('beforeend', '로그인 중...');

      // 전체화면 오버레이
      overlay.classList.add('show');
    });
  </script>
</body>

</html>
