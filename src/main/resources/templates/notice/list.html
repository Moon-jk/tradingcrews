<div xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout}">

  <head>
    <title>Notice | TradingCrews:트루</title>
  </head>

  <span layout:fragment="page-title">Notice Central</span>

  <div layout:fragment="content" class="p-4 md:p-8 space-y-6 max-w-[1440px] mx-auto min-h-screen">
      
      <!-- Main Container -->
      <div class="rounded-3xl p-5 md:p-10 border shadow-2xl flex flex-col min-h-[700px] bg-white dark:bg-navy-900 border-slate-200 dark:border-white/5 transition-colors duration-300">
        
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row md:justify-between md:items-end mb-8 pb-6 border-b border-slate-200 dark:border-white/10 gap-6 transition-colors duration-300">
          <div class="space-y-2">
            <h2 class="text-2xl md:text-3xl font-black flex items-center gap-3 tracking-tight text-slate-900 dark:text-white">
              <span class="w-2 md:w-2.5 h-8 md:h-10 rounded-full bg-electric shadow-[0_0_15px_var(--accent-glow)]"></span>
              공지사항
            </h2>
            <p class="text-xs ml-5 md:ml-6 font-medium text-slate-500 dark:text-slate-400">
              트루의 가장 빠르고 정확한 최신 소식을 전해드립니다.
            </p>
          </div>
          
          <div class="flex items-center gap-3">
            <!-- Search Form -->
            <form action="/notice" method="get" class="relative flex-1 sm:flex-none group">
              <input type="text" name="keyword" placeholder="Notice Search..." th:value="${keyword}"
                class="w-full sm:w-64 md:w-72 rounded-2xl pl-12 pr-6 py-3 text-xs font-bold border transition-all focus:outline-none focus:ring-2 focus:ring-electric/50 shadow-inner bg-slate-50 dark:bg-navy-950 border-slate-300 dark:border-white/10 text-slate-800 dark:text-slate-200">
              <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-electric transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
              </div>
            </form>
 
            <!-- Admin Write Button -->
            <div th:if="${session.loginMember != null and session.loginMember.role.name() == 'ADMIN'}" class="shrink-0">
              <a href="/notice/write" class="px-5 py-3 rounded-2xl text-white font-black bg-electric hover:bg-electric-600 transition-all text-[11px] uppercase tracking-widest shadow-lg blue-glow flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                </svg>
                <span class="hidden xs:inline">Write</span>
              </a>
            </div>
          </div>
        </div>

        <!-- List Section -->
        <div class="flex-1 w-full flex flex-col gap-3">
          <!-- Column Headers (PC Only) -->
          <div class="hidden sm:flex items-center px-6 pb-3 text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 dark:text-slate-500 border-b border-slate-100 dark:border-white/5">
            <div class="w-16 text-center">NO</div>
            <div class="flex-1 px-4">Headline</div>
            <div class="w-32 text-center">Release</div>
            <div class="w-20 text-center">Views</div>
          </div>

          <!-- Empty State -->
          <div th:if="${notices.isEmpty()}" class="py-24 text-center border-2 border-dashed rounded-3xl border-slate-200 dark:border-white/10 mt-4">
            <div class="flex flex-col items-center justify-center">
              <div class="w-16 h-16 rounded-3xl bg-slate-100 dark:bg-white/5 flex items-center justify-center mb-4 text-slate-400 dark:text-slate-600">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
              </div>
              <p class="text-xs font-bold text-slate-500">등록된 공지사항이 없습니다.</p>
            </div>
          </div>

          <!-- Notice Items -->
          <a th:each="notice, loop : ${notices}" th:href="@{|/notice/detail/${notice.id}|}" 
             class="group flex flex-col sm:flex-row sm:items-center p-4 sm:px-6 sm:py-5 rounded-2xl sm:rounded-3xl border transition-all duration-300 hover:-translate-y-1 hover:shadow-xl bg-slate-50 dark:bg-navy-950/50 border-slate-200 dark:border-white/5 hover:border-electric/50 dark:hover:border-electric/50 relative overflow-hidden">
            
            <div class="absolute left-0 top-0 bottom-0 w-1 bg-electric opacity-0 group-hover:opacity-100 transition-opacity"></div>

            <div class="flex items-center justify-between sm:justify-start w-full sm:w-auto mb-3 sm:mb-0">
              <!-- NO (Desktop) -->
              <div class="hidden sm:block w-16 text-center text-[11px] font-mono font-bold text-slate-400"
                   th:text="${notices.totalElements - (notices.number * notices.size) - loop.index}">1</div>
              
              <!-- NO (Mobile inline) -->
              <div class="sm:hidden text-[10px] font-mono font-bold text-slate-400 bg-slate-200 dark:bg-white/10 px-2 py-0.5 rounded-md"
                   th:text="'#' + ${notices.totalElements - (notices.number * notices.size) - loop.index}">#1</div>
              
              <!-- Mobile Date (Inline Right) -->
              <div class="sm:hidden text-[10px] font-medium text-slate-500" th:text="${#temporals.format(notice.createdAt, 'yy.MM.dd')}">24.03.20</div>
            </div>
            
            <!-- Headline -->
            <div class="flex-1 sm:px-4 flex items-center gap-3">
              <div th:if="${notice.pinned}" class="shrink-0 flex items-center justify-center w-6 h-6 rounded-lg bg-electric/10 border border-electric/20 text-[11px] shadow-sm">
                <span class="text-electric">📌</span>
              </div>
              
              <span th:text="${notice.title}" class="font-bold text-sm sm:text-base text-slate-800 dark:text-slate-200 group-hover:text-electric transition-colors line-clamp-1">시스템 점검 안내</span>
              
              <span th:if="${notices.number == 0 and !notice.pinned and loop.index < 2}" class="shrink-0 px-2 py-1 rounded-md text-[8px] font-black uppercase bg-gradient-to-r from-red-500 to-rose-400 text-white shadow-md shadow-red-500/20 animate-pulse">NEW</span>
            </div>
            
            <!-- Metadata (PC Only) -->
            <div class="hidden sm:block w-32 text-center text-xs font-semibold text-slate-500" th:text="${#temporals.format(notice.createdAt, 'yyyy.MM.dd')}">2024.03.20</div>
            <div class="hidden sm:flex w-20 justify-center items-center gap-1.5 text-[11px] font-bold text-slate-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 20 20" fill="currentColor">
                <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
              </svg>
              <span th:text="${notice.viewCount}">128</span>
            </div>
          </a>

        </div>

        <!-- Pagination -->
        <div class="mt-12 flex justify-center items-center gap-3" th:if="${!notices.isEmpty()}">
          <a th:href="@{/notice(page=${notices.number - 1}, keyword=${keyword})}" th:classappend="${notices.first} ? 'pointer-events-none opacity-30 saturate-0' : ''" 
             class="w-10 h-10 flex items-center justify-center rounded-2xl transition-all hover:bg-electric hover:text-white border shadow-sm active:scale-95 bg-white dark:bg-navy-800 text-slate-500 dark:text-slate-400 border-slate-200 dark:border-white/10">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
          </a>
          
          <div class="px-6 py-2.5 rounded-2xl text-[11px] font-black shadow-inner border flex items-center gap-3 bg-slate-50 dark:bg-navy-950 border-slate-200 dark:border-white/10 text-slate-800 dark:text-slate-200">
            <span th:text="${notices.number + 1}" class="text-electric text-sm">1</span> 
            <span class="opacity-40 font-normal">/</span> 
            <span th:text="${notices.totalPages}" class="text-slate-400">5</span>
          </div>

          <a th:href="@{/notice(page=${notices.number + 1}, keyword=${keyword})}" th:classappend="${notices.last} ? 'pointer-events-none opacity-30 saturate-0' : ''" 
             class="w-10 h-10 flex items-center justify-center rounded-2xl transition-all hover:bg-electric hover:text-white border shadow-sm active:scale-95 bg-white dark:bg-navy-800 text-slate-500 dark:text-slate-400 border-slate-200 dark:border-white/10">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" /></svg>
          </a>
        </div>

      </div>
  </div>
</div>
