<div xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout}">

  <head><title>Edit Notice | TradingCrews:트루</title></head>
  <span layout:fragment="page-title">Admin Portals</span>

  <div layout:fragment="content" class="p-2 md:p-8 min-h-screen">
    <div class="main-card rounded-3xl md:rounded-[2.5rem] p-5 md:p-12 border shadow-2xl max-w-[1440px] mx-auto" style="border-color: var(--border-base)">
      
      <div class="mb-6 md:mb-10 border-b pb-4 md:pb-6" style="border-color: var(--border-base)">
        <h2 class="text-xl md:text-2xl font-black flex items-center gap-2 md:gap-3 tracking-tight" style="color: var(--text-primary)">
          <span class="w-1.5 md:w-2 h-6 md:h-8 rounded-full bg-electric shadow-[0_0_10px_var(--accent-glow)]"></span>UPDATE POST
        </h2>
        <p class="text-[10px] md:text-xs mt-2 opacity-50" style="color: var(--text-muted)">현재 게시글을 최신 상태로 수정합니다.</p>
      </div>

      <form th:action="@{|/notice/edit/${notice.id}|}" method="post" class="space-y-6 md:space-y-8">
        <div class="space-y-2 md:space-y-3">
          <label for="title" class="px-1 text-[9px] md:text-[11px] font-black uppercase tracking-[0.2em]" style="color: var(--text-muted)">Topic / Title</label>
          <input type="text" id="title" name="title" th:value="${notice.title}" required placeholder="제목을 입력하세요"
            class="w-full rounded-xl md:rounded-2xl px-4 md:px-6 py-3.5 md:py-4 text-[13px] md:text-sm font-bold border transition-all focus:outline-none focus:ring-2 focus:ring-electric/30 shadow-inner"
            style="background: var(--bg-card); color: var(--text-primary); border-color: var(--border-base)">
        </div>

        <div class="flex items-center gap-2.5 px-1 py-1">
          <input type="checkbox" id="pinned" name="pinned" value="true" th:checked="${notice.pinned}"
            class="w-3.5 h-3.5 md:w-4 md:h-4 rounded border-[#2E3238] bg-[#1E2124] text-electric focus:ring-electric/30">
          <label for="pinned" class="text-[10px] md:text-xs font-black uppercase tracking-widest cursor-pointer" style="color: var(--text-primary)">Pin to top (상단 고정)</label>
        </div>

        <div class="space-y-2 md:space-y-3">
          <label for="content" class="px-1 text-[9px] md:text-[11px] font-black uppercase tracking-[0.2em]" style="color: var(--text-muted)">Detailed Substance</label>
          <textarea id="content" name="content" th:text="${notice.content}" required rows="10" md:rows="12" placeholder="정확한 수정 내용을 입력하세요..."
            class="w-full rounded-xl md:rounded-2xl px-4 md:px-6 py-4 md:py-5 text-[13px] md:text-sm leading-relaxed border transition-all focus:outline-none focus:ring-2 focus:ring-electric/30 shadow-inner resize-none font-sans"
            style="background: var(--bg-card); color: var(--text-primary); border-color: var(--border-base)"></textarea>
        </div>

        <div class="flex flex-col xs:flex-row justify-end gap-3 md:gap-4 pt-6 md:pt-8 border-t" style="border-color: var(--border-base)">
          <a th:href="@{|/notice/detail/${notice.id}|}" class="order-2 xs:order-1 px-6 md:px-8 py-3 md:py-4 rounded-xl md:rounded-2xl text-[11px] md:text-[12px] font-black uppercase tracking-widest transition-all hover:bg-slate-500/5 active:scale-95 border text-center" style="color: var(--text-muted); border-color: var(--border-base)">Discard</a>
          <button type="submit" class="order-1 xs:order-2 px-8 md:px-10 py-3 md:py-4 rounded-xl md:rounded-2xl text-white font-black text-[11px] md:text-[12px] uppercase tracking-widest bg-electric hover:bg-electric-600 transition-all shadow-lg blue-glow hover:scale-105 active:scale-95 text-center">SAVE CHANGES</button>
        </div>
      </form>

    </div>
  </div>
</div>
