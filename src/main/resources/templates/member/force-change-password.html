<div xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout}">

  <head>
    <title>Change Password | STOCK LAB</title>
  </head>

  <span layout:fragment="page-title">Change Password</span>

  <div layout:fragment="content">
    <div class="p-4 md:p-6 flex justify-center items-center min-h-[70vh]">

      <div
        class="bg-[#0f172a]/80 backdrop-blur-md border border-slate-800 rounded-3xl p-8 shadow-2xl w-full max-w-md relative overflow-hidden">

        <div
          class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 via-purple-500 to-blue-500 shadow-[0_0_15px_rgba(59,130,246,0.5)]">
        </div>

        <div class="text-center mb-8">
          <div
            class="w-16 h-16 bg-blue-500/10 border border-blue-500/30 rounded-full flex items-center justify-center mx-auto mb-4 shadow-[0_0_20px_rgba(59,130,246,0.2)]">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-blue-400" fill="none" viewBox="0 0 24 24"
              stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
          </div>
          <h2 class="text-2xl font-bold text-white mb-2">초기 비밀번호 변경</h2>
          <p class="text-slate-400 text-xs leading-relaxed">
            관리자에 의해 부여된 <span class="text-red-400 font-bold">임시 비밀번호</span>를 사용 중입니다.<br>
            안전한 플랫폼 이용을 위해 새로운 비밀번호를 설정해 주세요.
          </p>
        </div>

        <div th:if="${errorMessage}"
          class="mb-6 p-3 bg-red-500/10 border border-red-500/30 rounded-lg text-red-400 text-xs font-bold text-center">
          <span th:text="${errorMessage}">에러 메시지</span>
        </div>

        <form th:action="@{/member/force-change-password}" method="post" class="space-y-5">
          <div>
            <label class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wide">새 비밀번호 (New
              Password)</label>
            <input type="password" name="newPassword" required placeholder="새로운 비밀번호 입력"
              class="w-full bg-black/40 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all shadow-inner">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wide">새 비밀번호 확인
              (Confirm)</label>
            <input type="password" name="confirmPassword" required placeholder="새로운 비밀번호 다시 입력"
              class="w-full bg-black/40 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all shadow-inner">
          </div>

          <input type="hidden" name="redirectURL" th:value="${redirectURL}" th:if="${redirectURL != null}" />

          <button type="submit"
            class="w-full mt-4 px-8 py-3.5 bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold rounded-xl transition-all shadow-[0_0_15px_rgba(59,130,246,0.4)] hover:shadow-[0_0_25px_rgba(59,130,246,0.6)]">
            비밀번호 변경 및 시작하기
          </button>
        </form>

      </div>
    </div>
  </div>
</div>
