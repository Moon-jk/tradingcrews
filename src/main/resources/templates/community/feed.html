<div xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

    <head>
        <title>커뮤니티 | TradingCrews:트루</title>
        <style>
            .hide-scroll::-webkit-scrollbar {
                display: none;
            }

            .hide-scroll {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }

            /* [WYSIWYG] 게시글 본문 스타일 정의 */
            .post-content {
                line-height: 1.7;
            }
            .post-content ul {
                list-style-type: disc;
                margin-left: 1.5rem;
                margin-bottom: 1rem;
            }
            .post-content ol {
                list-style-type: decimal;
                margin-left: 1.5rem;
                margin-bottom: 1rem;
            }
            .post-content a {
                color: var(--accent);
                text-decoration: underline;
                font-weight: 600;
            }
            .post-content blockquote {
                border-left: 4px solid var(--border-strong);
                padding-left: 1rem;
                font-style: italic;
                margin: 1rem 0;
                color: var(--text-muted);
            }
            .post-content p {
                margin-bottom: 0.75rem;
            }
        </style>
    </head>

    <span layout:fragment="page-title">Community Hub</span>

    <div layout:fragment="content" class="flex flex-col md:flex-row gap-4 md:gap-6 p-2 md:p-4 max-w-[1440px] mx-auto h-[calc(100vh-90px)] md:h-[calc(100vh-100px)]">

        <!-- [좌측] 게시판 목록 -->
        <aside
            class="w-full md:w-64 flex-shrink-0 border rounded-2xl md:rounded-3xl p-3 md:p-4 shadow-xl overflow-y-auto hide-scroll flex flex-col h-auto md:h-[calc(100vh-150px)]"
            style="background: var(--bg-card); border-color: var(--border-base)">
            <h3 class="hidden md:block text-[10px] font-black uppercase tracking-[0.2em] pl-2 mb-4" style="color: var(--text-muted)">📢 Channels</h3>
            <div class="flex-1 flex flex-row md:flex-col gap-2 overflow-x-auto md:overflow-y-auto pb-2 md:pb-0 hide-scroll">
                <a th:each="b : ${allBoards}" th:href="@{|/community/${b.id}|}"
                    class="flex items-center gap-2 md:gap-3 px-3 py-2 md:px-4 md:py-3 rounded-xl md:rounded-2xl text-sm md:text-base transition-all font-bold min-w-max md:min-w-0 shrink-0 border"
                    th:style="${b.id == currentBoard.id} ? 'background: rgba(59, 130, 246, 0.1); color: var(--accent); border-color: rgba(59, 130, 246, 0.3)' : 'background: var(--bg-muted); color: var(--text-primary); border-color: transparent'"
                    th:classappend="${b.id == currentBoard.id} ? '' : 'hover:bg-slate-500/10'">
                    <span class="text-base md:text-lg">💬</span>
                    <span th:text="${b.topicName}">게시판</span>
                </a>
            </div>
            
            <div class="flex flex-row md:flex-col gap-2 md:gap-3 w-full mt-3 md:mt-auto pt-3 md:pt-4 border-t shrink-0" style="border-color: var(--border-base)">
                <!-- 가입 / 취소 토글 버튼 -->
                <form th:action="@{|/community/${currentBoard.id}/subscribe|}" method="post" class="flex-1">
                    <button type="submit"
                        class="auth-required w-full h-full px-4 py-3 font-black rounded-xl text-[11px] uppercase tracking-widest transition-all border shadow-lg flex items-center justify-center"
                        th:style="${isSubscribed} ? 'background: var(--bg-card); color: var(--text-muted); border-color: var(--border-base)' : 'background: var(--accent); color: white; border-color: var(--accent)'"
                        th:classappend="${isSubscribed} ? 'hover:bg-red-500/10 hover:text-red-500 hover:border-red-500/30' : 'hover:scale-[1.02] shadow-blue-500/20'">
                        <span th:text="${isSubscribed} ? 'Leave Channel' : 'Join Channel'"></span>
                    </button>
                </form>

                <!-- 글 작성 링크 버튼 -->
                <a th:href="@{|/community/${currentBoard.id}/posts/new|}"
                    class="auth-required flex-1 w-full h-full flex items-center justify-center gap-2 px-4 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-xl text-[11px] uppercase tracking-widest transition-all border border-emerald-500 shadow-lg hover:scale-[1.02] shadow-emerald-500/20">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="3">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                    </svg>
                    Publish
                </a>
            </div>
        </aside>

        <!-- [중앙] 피드 및 글 작성 -->
        <main class="flex-1 overflow-y-auto hide-scroll pb-24 md:pb-20 md:h-[calc(100vh-150px)]">

            <div th:if="${successMessage}"
                class="mb-4 p-4 border rounded-xl text-green-500 text-sm font-bold shadow-lg"
                style="background: rgba(34, 197, 94, 0.1); border-color: rgba(34, 197, 94, 0.3)">
                <span th:text="${successMessage}"></span>
            </div>
            <div th:if="${errorMessage}"
                class="mb-4 p-4 border rounded-xl text-red-500 text-sm font-bold shadow-lg"
                style="background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.3)">
                <span th:utext="${errorMessage}"></span>
            </div>

            <!-- 게시판 헤더 -->
            <div
                class="border rounded-2xl md:rounded-3xl p-5 md:p-8 shadow-2xl mb-4 md:mb-6 relative overflow-hidden shrink-0"
                style="background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-muted) 100%); border-color: var(--border-base)">
                <div
                    class="absolute -top-10 -right-10 w-32 h-32 md:w-40 md:h-40 bg-blue-500/10 rounded-full blur-2xl md:blur-3xl pointer-events-none">
                </div>

                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-2 md:gap-4 relative z-10">
                    <div class="flex flex-col gap-1 md:gap-2">
                        <div class="flex items-center gap-3">
                            <h1 class="text-xl md:text-3xl font-black" style="color: var(--text-primary)" th:utext="${currentBoard.topicName}">
                                게시판 이름</h1>
                            <div title="Subscribers" class="px-2.5 py-1 rounded-lg flex items-center gap-1.5 shadow-inner border"
                                 style="background: var(--bg-muted); border-color: var(--border-base)">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 md:w-4 md:h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="color: var(--accent)">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                                </svg>
                                <span class="text-[10px] md:text-xs font-black uppercase tracking-tighter" style="color: var(--text-primary)" th:utext="${currentBoard.subscribers.size() + ' Crews'}">0명</span>
                            </div>
                        </div>
                        <p class="text-xs md:text-sm italic" style="color: var(--text-muted)"
                            th:utext="${currentBoard.description ?: '자유롭게 의견을 나누어 보세요!'}">게시판 설명</p>
                    </div>
                </div>
            </div>

            <!-- 안내 메시지 -->
            <div th:if="${member != null and !isSubscribed and member.role.name() != 'ADMIN'}"
                class="rounded-2xl p-4 mb-6 text-center border shadow-inner"
                style="background: var(--bg-muted); border-color: var(--border-base)">
                <span class="text-xs md:text-sm font-bold" style="color: var(--text-muted)">✏️ Join this channel to start publishing.</span>
            </div>
            
            <!-- 게시글 목록 (피드 리스트) -->
            <div class="space-y-4">
                <div th:if="${posts == null or posts.isEmpty()}"
                    class="py-20 text-center text-sm font-bold opacity-30 shrink-0" style="color: var(--text-muted)">
                    <div class="text-4xl mb-4">📭</div>
                    Be the first to share your thoughts!
                </div>

                <!-- 개별 Post -->
                <div th:each="post : ${posts}"
                    class="rounded-2xl md:rounded-3xl p-4 md:p-6 shadow-xl border hover:scale-[1.005] transition-all flex gap-3 md:gap-5 shrink-0"
                    style="background: var(--bg-card); border-color: var(--border-base)">

                    <!-- 좌측: 업보트 컨트롤 -->
                    <div class="flex flex-col items-center gap-1.5 shrink-0 pt-1">
                        <button type="button" 
                            class="auth-required p-1"
                            th:classappend="${upvotedPostIds != null and upvotedPostIds.contains(post.id)} ? '!text-pink-500 hover:!text-pink-600 transition-colors' : 'text-slate-500 hover:text-pink-500 transition-colors'"
                            th:onclick="'upvote(' + ${post.id} + ', this)'" title="추천">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6 md:w-7 md:h-7 transition-transform transform active:scale-75">
                                 <path d="M7.493 18.532l-2.029.006c-1.396 0-2.527-1.13-2.527-2.527V9.527C2.937 8.131 4.068 7 5.464 7l2.029-.005V18.532z" />
                                 <path d="M9.531 18.528l8.369-.026c1.196 0 2.247-.798 2.535-1.956l1.411-5.642c.451-1.804-.925-3.522-2.785-3.522h-5.26c.216-1.168.647-3.92 0-4.632-.387-.426-.957-.591-1.472-.638-1.503-.137-2.906 1.079-3.414 2.459-1.332 3.619-3.235 5.572-3.805 6.075-.467.411-.741 1.002-.741 1.624l-.014 4.545c0 1.076.87 1.947 1.946 1.947l1.23.003h-.001z" />
                            </svg>
                        </button>
                        <span class="font-black text-[11px] md:text-sm" style="color: var(--text-primary)" th:id="'upvotes-' + ${post.id}"
                            th:utext="${post.upvotedMembers.size()}">0</span>
                    </div>

                    <!-- 우측: 콘텐츠 및 댓글 -->
                    <div class="flex-1 overflow-hidden">
                        <!-- 헤더: 작성자, 작성시간, 삭제버튼 -->
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center gap-2">
                                <div class="w-6 h-6 rounded-lg flex items-center justify-center text-[10px] font-black text-white shadow-md uppercase"
                                     style="background: var(--accent)"
                                    th:utext="${#strings.substring(post.author.nickname, 0, 1)}">A</div>
                                <span class="text-xs font-black" style="color: var(--text-primary)"
                                    th:utext="${post.author.nickname}">유저</span>
                                <span class="text-[9px] font-mono opacity-40" style="color: var(--text-muted)"
                                    th:utext="${#temporals.format(post.createdAt, 'MM.dd HH:mm')}">시간</span>
                            </div>
                            <!-- 삭제 버튼 -->
                            <form th:if="${member != null and (member.id == post.author.id or member.role.name() == 'ADMIN')}"
                                th:action="@{|/community/posts/${post.id}/delete|}" method="post"
                                onsubmit="return confirm('이 게시글을 삭제하시겠습니까?');">
                                <button type="submit" class="hover:text-red-500 transition-colors p-1 opacity-20 hover:opacity-100"
                                        style="color: var(--text-muted)" title="삭제">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none"
                                        viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                    </svg>
                                </button>
                            </form>
                        </div>

                        <!-- 본문 (HTML 지원) -->
                        <div class="post-content text-[13px] md:text-base mb-4 break-words whitespace-pre-wrap"
                             style="color: var(--text-primary)" th:utext="${post.content}">내용</div>

                        <!-- 토글 댓글창 버튼 -->
                        <div class="flex items-center gap-4">
                            <button type="button"
                                class="text-[11px] font-black hover:text-blue-500 transition-colors flex items-center gap-1.5 px-3 py-1 rounded-full border"
                                style="color: var(--text-muted); background: var(--bg-muted); border-color: var(--border-base)"
                                th:onclick="'toggleCommentSection(' + ${post.id} + ')'">
                                <span>💬</span>
                                <span th:utext="${post.comments.size()} + ' Comments'">0 개의 댓글</span>
                            </button>
                        </div>

                        <!-- 댓글 영역 -->
                        <div th:id="'comments-section-' + ${post.id}"
                            class="hidden mt-5 pt-5 border-t" style="border-color: var(--border-base)">
                            <!-- 기존 댓글 목록 -->
                            <div
                                class="space-y-4 mb-5 max-h-[300px] overflow-y-auto hide-scroll pl-2 border-l-2" style="border-color: var(--border-base)">
                                <div th:each="comment : ${post.comments}" class="flex gap-3 text-sm">
                                    <div
                                        class="w-6 h-6 mt-0.5 rounded-lg flex items-center justify-center shrink-0 border shadow-sm"
                                        style="background: var(--bg-card); border-color: var(--border-base)">
                                        <span class="text-[9px] font-black opacity-40" style="color: var(--text-primary)"
                                            th:utext="${#strings.substring(comment.author.nickname, 0, 1)}">U</span>
                                    </div>
                                    <div class="flex-1">
                                        <div class="flex items-center gap-2 mb-1">
                                            <span class="font-black text-[11px]" style="color: var(--text-primary)"
                                                th:utext="${comment.author.nickname}">유저</span>
                                            <span class="text-[8px] font-mono opacity-30" style="color: var(--text-muted)"
                                                th:utext="${#temporals.format(comment.createdAt, 'MM.dd HH:mm')}">시간</span>
                                        </div>
                                        <p class="text-[12px] leading-relaxed break-words whitespace-pre-wrap" style="color: var(--text-primary)"
                                            th:utext="${comment.content}">댓글</p>
                                    </div>
                                </div>
                                <div th:if="${post.comments.isEmpty()}" class="text-[11px] italic opacity-30 py-2" style="color: var(--text-muted)">No comments yet.</div>
                            </div>

                            <!-- 댓글 입력 폼 -->
                            <div>
                                <form th:action="@{|/community/posts/${post.id}/comments|}" method="post"
                                    class="flex gap-2">
                                    <input type="text" name="content" required placeholder="Add a comment..."
                                        class="auth-required flex-1 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition-all border shadow-inner"
                                        style="background: var(--bg-muted); color: var(--text-primary); border-color: var(--border-base)">
                                    <button type="submit"
                                        class="auth-required px-5 rounded-xl text-[11px] font-black uppercase transition-all border whitespace-nowrap shadow-md text-white border-blue-600"
                                        style="background: var(--accent)">POST</button>
                                </form>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </main>
    </div>

    <th:block layout:fragment="script">
        <script>
            function toggleCommentSection(postId) {
                const el = document.getElementById('comments-section-' + postId);
                if (el.classList.contains('hidden')) {
                    el.classList.remove('hidden');
                } else {
                    el.classList.add('hidden');
                }
            }

            function upvote(postId, btn) {
                const csrfTokenMeta = document.querySelector('meta[name="_csrf"]');
                const csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');
                const headers = {};
                if (csrfTokenMeta && csrfHeaderMeta) {
                    headers[csrfHeaderMeta.content] = csrfTokenMeta.content;
                }

                fetch(`/community/posts/${postId}/upvote`, { method: 'POST', headers: headers })
                    .then(res => res.text())
                    .then(result => {
                        if (result === 'auth_fail') {
                            showConfirmModal('로그인 필요', '로그인이 필요한 서비스입니다. 로그인 페이지로 이동하시겠습니까?', () => {
                                window.location.href = '/login?redirectURL=' + encodeURIComponent(window.location.pathname);
                            });
                        } else {
                            const params = result.split(':');
                            if (params.length < 2) return;
                            const count = params[0];
                            const isActive = params[1];
                            
                            const countEl = document.getElementById('upvotes-' + postId);
                            if (countEl) countEl.innerText = count;
                            
                            if (isActive === 'true') {
                                btn.classList.remove('text-slate-500');
                                btn.classList.add('!text-pink-500');
                                btn.style.removeProperty('color');
                            } else {
                                btn.classList.remove('!text-pink-500');
                                btn.classList.add('text-slate-500');
                                btn.style.removeProperty('color');
                            }
                            
                            // Pop action
                            btn.style.transform = "scale(1.2)";
                            setTimeout(() => btn.style.transform = "scale(1)", 150);
                        }
                    });
            }
        </script>
    </th:block>
</div>
