<div xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

    <head>
        <title>일정 & 뉴스 검색 | STOCK LAB</title>
        <style>
            .widget-card {
                background-color: #0f172a;
                border: 1px solid rgba(51, 65, 85, 0.5);
                border-radius: 1.5rem;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            }
            /* 검색창 포커스 효과 */
            .search-input:focus {
                border-color: #3b82f6;
                box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
            }
        </style>
    </head>

    <span layout:fragment="page-title">시장 일정 및 종목 뉴스 검색</span>

    <div layout:fragment="content">
        <div class="p-4 md:p-6 space-y-6">
            
            <div class="widget-card h-[380px]">
                <div class="px-6 py-4 border-b border-slate-800 bg-slate-800/20">
                    <h3 class="text-xs font-bold text-emerald-400 uppercase tracking-widest">Global Economic Calendar</h3>
                </div>
                <div id="calendar_container" class="flex-1 w-full"></div>
            </div>

            <div class="widget-card h-[550px]">
                <div class="px-6 py-4 border-b border-slate-800 bg-slate-800/20 flex flex-col md:flex-row justify-between items-center gap-4">
                    <div class="flex items-center gap-2">
                        <span class="text-blue-400">🗞️</span>
                        <h3 class="text-xs font-bold text-slate-300 uppercase tracking-widest">Stock Specific News</h3>
                    </div>
                    
                    <div class="relative w-full md:w-72">
                        <input type="text" id="symbol_search" placeholder="종목코드 입력 (예: AAPL, TSLA, BTCUSD)" 
                               class="search-input w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-xs text-white outline-none transition-all">
                        <button onclick="updateNewsWidget()" class="absolute right-2 top-1.5 p-1 rounded-lg bg-blue-600 hover:bg-blue-500 text-white transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                        </button>
                    </div>
                </div>
                
                <div id="news_timeline_container" class="flex-1 w-full"></div>
            </div>
            
        </div>

        <script th:inline="javascript">
            // 위젯 업데이트 함수 (검색 시 호출)
            function updateNewsWidget() {
                const symbol = document.getElementById('symbol_search').value.trim().toUpperCase();
                const newsContainer = document.getElementById('news_timeline_container');
                
                if (!newsContainer) return;
                
                // 기존 위젯 제거
                newsContainer.innerHTML = "";

                const script = document.createElement('script');
                script.type = 'text/javascript';
                script.src = "https://s3.tradingview.com/external-embedding/embed-widget-timeline.js";
                script.async = true;

                // 심볼이 있으면 해당 종목 뉴스, 없으면 전체 뉴스
                const widgetConfig = {
                    "colorTheme": "dark",
                    "isTransparent": true,
                    "displayMode": "regular",
                    "width": "100%",
                    "height": "100%",
                    "locale": "kr"
                };

                if (symbol) {
                    widgetConfig.feedMode = "symbol";
                    widgetConfig.symbol = symbol;
                } else {
                    widgetConfig.feedMode = "all_symbols";
                }

                script.innerHTML = JSON.stringify(widgetConfig);
                newsContainer.appendChild(script);
            }

            // 초기 로드 시 실행할 함수
            function initWidgets() {
                if (typeof TradingView === 'undefined') {
                    setTimeout(initWidgets, 500);
                    return;
                }

                // 1. 경제 캘린더 초기화
                const calContainer = document.getElementById('calendar_container');
                const calScript = document.createElement('script');
                calScript.src = "https://s3.tradingview.com/external-embedding/embed-widget-events.js";
                calScript.async = true;
                calScript.innerHTML = JSON.stringify({
                    "width": "100%", "height": "100%", "colorTheme": "dark",
                    "isTransparent": true, "locale": "kr", "importanceFilter": "-1,0,1"
                });
                calContainer.appendChild(calScript);

                // 2. 뉴스 위젯 초기화 (기본은 전체 뉴스)
                updateNewsWidget();
            }

            // 엔터키 검색 지원
            document.getElementById('symbol_search')?.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    updateNewsWidget();
                }
            });

            window.addEventListener('load', initWidgets);
        </script>
    </div>
</div>
