<!-- 카드뉴스 관리 목록 페이지 (admin/cardnews.html) -->
<div xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout}">

  <head>
    <title>카드뉴스 관리 | Admin</title>
  </head>

  <span layout:fragment="page-title">CardNews Manager</span>

  <div layout:fragment="content">
    <div class="p-4 md:p-6 space-y-6">

      <!-- 헤더 -->
      <div class="flex items-center mb-8 pb-6 border-b border-white/5 gap-4">
        <div class="w-12 h-12 rounded-2xl bg-cyan-500/10 flex items-center justify-center shadow-lg border border-cyan-500/20">
          <span class="text-2xl">📋</span>
        </div>
        <div>
          <h2 class="text-2xl font-black text-white uppercase tracking-tighter">CardNews Manager</h2>
          <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest mt-1">AI 생성 카드뉴스 목록 · 수정 · 삭제</p>
        </div>
        <div class="ml-auto">
          <a href="/admin/members" class="px-5 py-2.5 text-xs font-black text-slate-400 hover:text-white bg-white/5 border border-white/10 rounded-xl transition-all">← 어드민 허브</a>
        </div>
      </div>

      <!-- 플래시 메시지 -->
      <div th:if="${successMessage}" class="mb-4 p-4 bg-green-500/10 border border-green-500/30 rounded-xl text-green-400 text-sm font-bold">
        ✅ <span th:text="${successMessage}"></span>
      </div>
      <div th:if="${errorMessage}" class="mb-4 p-4 bg-red-500/10 border border-red-500/30 rounded-xl text-red-400 text-sm font-bold">
        ❌ <span th:text="${errorMessage}"></span>
      </div>

      <!-- 복사 완료 토스트 알림 -->
      <div id="copy-toast"
        class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[200] flex items-center gap-2 px-5 py-3 bg-cyan-600 text-white text-sm font-black rounded-2xl shadow-2xl shadow-cyan-500/30 opacity-0 pointer-events-none transition-all duration-300">
        ✅ 캡션이 클립보드에 복사되었습니다!
      </div>

      <!-- 카드뉴스 없을 때 -->
      <div th:if="${newsList == null or newsList.isEmpty()}"
        class="flex flex-col items-center justify-center py-24 text-slate-500">
        <div class="text-6xl mb-4">📭</div>
        <p class="text-lg font-bold">아직 생성된 카드뉴스가 없습니다.</p>
        <p class="text-sm mt-1">카드라슈를 실행하고 주제를 입력해 보세요!</p>
      </div>

      <!-- 목록 테이블 -->
      <div th:if="${newsList != null and !newsList.isEmpty()}"
        class="bg-white/5 border border-white/10 rounded-[2rem] overflow-hidden shadow-2xl">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="text-slate-500 text-[10px] uppercase font-black tracking-widest border-b border-white/5 bg-white/5">
                <th class="py-5 px-6">ID</th>
                <th class="py-5 px-6">주제</th>
                <th class="py-5 px-6 text-center">카드 수</th>
                <th class="py-5 px-6">생성일</th>
                <th class="py-5 px-6">인스타 캡션</th>
                <th class="py-5 px-6 text-center">관리</th>
              </tr>
            </thead>
            <tbody class="text-sm text-slate-300">
              <tr th:each="news : ${newsList}"
                class="border-b border-white/5 hover:bg-white/5 transition-all">
                <td class="py-5 px-6 text-slate-600 font-mono text-xs" th:text="'#' + ${news.id}"></td>
                <td class="py-5 px-6">
                  <a th:href="@{/infocenter/{id}(id=${news.id})}" target="_blank"
                    class="text-white font-bold hover:text-cyan-400 transition-colors" th:text="${news.topic}">주제</a>
                </td>
                <td class="py-5 px-6 text-center">
                  <span class="px-3 py-1 rounded-full text-[10px] font-black bg-cyan-500/10 text-cyan-400 border border-cyan-500/20"
                    th:text="${news.pageCount} + '장'">6장</span>
                </td>
                <td class="py-5 px-6 text-slate-400 text-xs" th:text="${news.createdDate}"></td>

                <!-- 캡션 미리보기 + 복사 버튼 -->
                <td class="py-5 px-6 max-w-xs">
                  <div th:if="${news.instagramCaption != null and news.instagramCaption != ''}" class="flex items-center gap-2">
                    <p class="text-slate-400 text-xs truncate flex-1"
                      th:text="${#strings.abbreviate(news.instagramCaption, 55)}"></p>
                    <button
                      th:attr="onclick='copyCaption(this, ' + '`' + ${news.instagramCaption} + '`' + ')'"
                      title="캡션 복사"
                      class="shrink-0 flex items-center gap-1 px-3 py-1.5 bg-cyan-600/20 hover:bg-cyan-600 text-cyan-400 hover:text-white text-[10px] font-black rounded-lg border border-cyan-600/30 transition-all active:scale-95">
                      📋 복사
                    </button>
                  </div>
                  <span th:if="${news.instagramCaption == null or news.instagramCaption == ''}"
                    class="text-slate-600 text-xs italic">(캡션 없음)</span>
                </td>

                <td class="py-5 px-6">
                  <div class="flex items-center justify-center gap-2">
                    <a th:href="@{/admin/cardnews/{id}/edit(id=${news.id})}"
                      class="px-4 py-2 bg-cyan-600/20 hover:bg-cyan-600 text-cyan-400 hover:text-white text-[10px] font-black rounded-xl border border-cyan-600/30 transition-all">수정</a>
                    <form th:action="@{/admin/cardnews/{id}/delete(id=${news.id})}" method="post"
                      onsubmit="return confirm('정말 삭제하시겠습니까? 복구할 수 없습니다.')">
                      <button type="submit"
                        class="px-4 py-2 bg-red-600/10 hover:bg-red-600 text-red-500 hover:text-white text-[10px] font-black rounded-xl border border-red-600/20 transition-all">삭제</button>
                    </form>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>

    <!-- 복사 기능 스크립트 -->
    <script>
      function copyCaption(btn, text) {
        navigator.clipboard.writeText(text).then(() => {
          // 버튼 피드백
          const original = btn.innerHTML;
          btn.innerHTML = '✅ 복사됨';
          btn.classList.add('bg-cyan-600', 'text-white');
          btn.classList.remove('bg-cyan-600/20', 'text-cyan-400');
          setTimeout(() => {
            btn.innerHTML = original;
            btn.classList.remove('bg-cyan-600', 'text-white');
            btn.classList.add('bg-cyan-600/20', 'text-cyan-400');
          }, 2000);

          // 토스트 알림
          const toast = document.getElementById('copy-toast');
          toast.classList.remove('opacity-0', 'pointer-events-none');
          toast.classList.add('opacity-100');
          setTimeout(() => {
            toast.classList.remove('opacity-100');
            toast.classList.add('opacity-0', 'pointer-events-none');
          }, 2500);
        }).catch(() => {
          // 구형 브라우저 폴백
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          alert('캡션이 복사되었습니다!');
        });
      }
    </script>
  </div>
</div>
