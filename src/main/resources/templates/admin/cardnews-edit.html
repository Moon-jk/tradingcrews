<!-- 카드뉴스 수정 페이지 (admin/cardnews-edit.html) -->
<div xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout}">

  <head>
    <title>카드뉴스 수정 | Admin</title>
  </head>

  <span layout:fragment="page-title">CardNews Edit</span>

  <div layout:fragment="content">
    <div class="p-4 md:p-6 max-w-3xl mx-auto space-y-6">

      <!-- 헤더 -->
      <div class="flex items-center mb-6 pb-6 border-b border-white/5 gap-4">
        <div class="w-12 h-12 rounded-2xl bg-cyan-500/10 flex items-center justify-center shadow-lg border border-cyan-500/20">
          <span class="text-2xl">✏️</span>
        </div>
        <div>
          <h2 class="text-xl font-black text-white uppercase tracking-tighter">카드뉴스 수정</h2>
          <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest mt-1" th:text="'#' + ${cardNews.id} + ' · ' + ${cardNews.createdDate}"></p>
        </div>
        <div class="ml-auto">
          <a href="/admin/cardnews" class="px-5 py-2.5 text-xs font-black text-slate-400 hover:text-white bg-white/5 border border-white/10 rounded-xl transition-all">← 목록으로</a>
        </div>
      </div>

      <form th:action="@{/admin/cardnews/{id}/edit(id=${cardNews.id})}" method="post" class="space-y-6">

        <!-- 주제 -->
        <div class="bg-white/5 border border-white/10 rounded-[2rem] p-8 shadow-xl">
          <h3 class="text-xs font-black text-cyan-400 uppercase tracking-widest mb-5">📌 기본 정보</h3>
          <div class="space-y-2">
            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest">주제 (Topic)</label>
            <input type="text" name="topic" th:value="${cardNews.topic}" required
              class="w-full bg-black/40 border border-white/10 rounded-2xl px-5 py-4 text-sm text-white focus:outline-none focus:border-cyan-500 transition-all shadow-inner">
          </div>
        </div>

        <!-- 인스타그램 캡션 -->
        <div class="bg-white/5 border border-white/10 rounded-[2rem] p-8 shadow-xl">
          <h3 class="text-xs font-black text-cyan-400 uppercase tracking-widest mb-5">📱 인스타그램 캡션</h3>
          <div class="space-y-2">
            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest">캡션 내용 (줄바꿈 포함 자유 편집)</label>
            <textarea name="instagramCaption" rows="7" th:text="${cardNews.instagramCaption}"
              class="w-full bg-black/40 border border-white/10 rounded-2xl px-5 py-4 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition-all shadow-inner resize-y"></textarea>
          </div>
        </div>

        <!-- 카드 페이지 수정 -->
        <div class="bg-white/5 border border-white/10 rounded-[2rem] p-8 shadow-xl">
          <h3 class="text-xs font-black text-cyan-400 uppercase tracking-widest mb-5">📄 카드 내용 수정</h3>
          <div class="space-y-5">
            <div th:each="page, iter : ${pages}"
              class="p-6 bg-black/30 border border-white/5 rounded-[1.5rem]">
              <p class="text-[10px] font-black text-cyan-400 uppercase tracking-widest mb-4"
                th:text="'PAGE ' + ${page.pageNum}"></p>
              <input type="hidden" th:name="'pageId_' + ${iter.index}" th:value="${page.id}">
              <div class="space-y-3">
                <div>
                  <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">제목</label>
                  <input type="text" th:name="'title_' + ${iter.index}" th:value="${page.title}"
                    class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-500 transition-all">
                </div>
                <div>
                  <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">본문</label>
                  <textarea th:name="'content_' + ${iter.index}" rows="3" th:text="${page.content}"
                    class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition-all resize-y"></textarea>
                </div>
              </div>
            </div>
          </div>
          <input type="hidden" name="pageCount" th:value="${pages.size()}">
        </div>

        <!-- 버튼 -->
        <div class="flex justify-end gap-3 pb-8">
          <a href="/admin/cardnews"
            class="px-6 py-3 text-sm font-black text-slate-400 hover:text-white bg-white/5 border border-white/10 rounded-xl transition-all">취소</a>
          <button type="submit"
            class="px-8 py-3 bg-cyan-600 hover:bg-cyan-500 text-white text-sm font-black rounded-xl transition-all shadow-lg shadow-cyan-500/20 active:scale-95">💾 저장하기</button>
        </div>

      </form>
    </div>
  </div>
</div>
