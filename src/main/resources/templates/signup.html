<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" th:href="@{/favicon.png}" />
    <title>TradingCrews:트루 | Signup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #0369A1;
            --color-primary: var(--accent);
            --color-primary-dark: #0089A5;
            --color-border: #e2e8f0;
            --color-muted: #94a3b8;
            --color-text: #0f172a;
            --color-subtext: #64748b;
            --color-bg: #eef2f7;
            --color-surface: #ffffff;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            background-color: var(--color-bg);
            font-family: 'DM Sans', sans-serif;
            padding: 1.5rem;
        }

        /* ── 카드 ── */
        .card {
            display: flex;
            flex-direction: column;
            background: var(--color-surface);
            border-radius: 24px;
            padding: 10px;
            width: clamp(300px, 90vw, 780px);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.1);
        }

        /* ── 히어로 패널 ── */
        .hero {
            background: linear-gradient(135deg, #090E18 0%, #0E1620 45%, var(--accent) 100%);
            border-radius: 18px;
            overflow: hidden;
            position: relative;
        }

        .hero::before,
        .hero::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
        }

        .hero::before {
            width: 260px;
            height: 260px;
            top: -80px;
            right: -60px;
        }

        .hero::after {
            width: 160px;
            height: 160px;
            bottom: -40px;
            left: -30px;
        }

        .hero-inner {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 2rem 2.2rem;
            min-height: 180px;
            height: 100%;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 100px;
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 14px;
            width: fit-content;
            backdrop-filter: blur(4px);
        }

        .hero-badge span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #fcd34d;
            display: inline-block;
        }

        .hero h2 {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.35;
            margin-bottom: 8px;
        }

        .hero p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
            display: none;
        }

        /* ── 폼 영역 ── */
        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 2rem 1.5rem;
        }

        .form-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--color-text);
            margin-bottom: 2px;
        }

        .form-subtitle {
            font-size: 13px;
            color: var(--color-subtext);
        }

        /* ── 인풋 필드 ── */
        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 11px;
            font-weight: 600;
            color: var(--color-subtext);
            text-transform: uppercase;
            letter-spacing: 0.07em;
        }

        input {
            height: 46px;
            border: 1px solid var(--color-border);
            border-radius: 10px;
            background: #f8fafc;
            padding: 0 14px;
            font-family: inherit;
            font-size: 14px;
            color: var(--color-text);
            outline: none;
            width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        input::placeholder {
            color: var(--color-muted);
        }

        input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
            background: #fff;
        }

        /* ── 에러 ── */
        .error-box {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 500;
            color: #ef4444;
            text-align: center;
        }

        .success-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 500;
            color: #15803d;
            text-align: center;
        }

        /* ── 제출 버튼 ── */
        button[type="submit"] {
            height: 46px;
            background: var(--color-primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            letter-spacing: 0.02em;
            box-shadow: 0 4px 14px rgba(2, 166, 200, 0.3);
            transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
            margin-top: 2px;
        }

        button[type="submit"]:hover {
            background: var(--color-primary-dark);
            box-shadow: 0 4px 20px rgba(2, 166, 200, 0.45);
        }

        button[type="submit"]:active {
            transform: scale(0.98);
        }

        /* ── 하단 회원가입 링크 ── */
        .signup-text {
            text-align: center;
            font-size: 12px;
            color: var(--color-subtext);
        }

        .signup-text a {
            color: var(--color-primary);
            font-weight: 600;
            text-decoration: none;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

        /* ════════════════════════════════
       반응형
       ════════════════════════════════ */
        @media (min-width: 500px) {
            form {
                padding: 2rem 2.5rem;
            }

            .hero p {
                display: block;
            }
        }

        @media (min-width: 640px) {
            .card {
                flex-direction: row;
                padding: 10px 0 10px 10px;
            }

            .hero,
            form {
                flex: 1 1 50%;
            }

            .hero-inner {
                justify-content: center;
                padding: 2.5rem 2rem;
                min-height: 420px;
            }

            .hero p {
                display: block;
            }

            form {
                padding: 2.5rem 2.2rem;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <!-- ── 히어로 ── -->
        <div class="hero">
            <div class="hero-inner">
                <div class="hero-badge">
                    <span></span> 간단한 가입
                </div>
                <h2>지금 계정을 만들고,<br>크루로 합류하세요</h2>
                <p>함께 성장하는 트레이딩 커뮤니티,<br>실시간 데이터와 인사이드를 공유하세요.</p>
            </div>
        </div>

        <!-- ── 가입 폼 ── -->
        <form id="signup-form" th:action="@{/signup}" method="post">

            <div>
                <p class="form-title">회원가입 <span style="font-size: 14px; color: #02A6C8;">TradingCrews</span></p>
                <p class="form-subtitle">아이디와 닉네임만 적어주세요</p>
            </div>

            <div class="field">
                <label for="loginId">Login ID</label>
                <input type="text" id="loginId" name="loginId" required minlength="4" maxlength="20"
                    placeholder="사용할 아이디 (4자리 이상) 입력" />
            </div>

            <div class="field">
                <label for="nickname">Nickname</label>
                <input type="text" id="nickname" name="nickname" required minlength="2" maxlength="15"
                    placeholder="사용할 닉네임 입력" />
            </div>

            <p style="font-size:11px; color:#64748b; margin-top:-4px; line-height: 1.4;">※ 초기 비밀번호는 아이디와 동일하게 설정되며, 첫
                로그인 후 언제든 변경하실 수 있습니다.</p>

            <!-- 에러 메세지 (Thymeleaf) -->
            <div th:if="${errorMessage}" class="error-box" th:text="${errorMessage}">
                에러 메세지
            </div>

            <button type="submit">가입하기</button>

            <p class="signup-text">
                이미 계정이 있으신가요? <a href="/login">로그인 하기</a>
            </p>

        </form>
    </div>
</body>

</html>
