<div xmlns:th="http://www.thymeleaf.org" 
     xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
     layout:decorate="~{layout}">

    <head>
        <title>실시간 종목 모니터링</title>
    </head>

    <span layout:fragment="page-title">실시간 종목 모니터링</span>

    <div layout:fragment="content">        
        <div class="p-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div th:each="symbol, stat : ${symbols}" 
                     class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl hover:border-slate-600 transition-all">
                    
                    <div class="px-4 py-2 bg-slate-800/80 font-mono text-sm font-bold border-b border-slate-700 flex justify-between items-center">
                        <span class="text-blue-400" th:text="${symbol}">SYMBOL</span>
                        <span class="text-[10px] text-slate-500 uppercase">Live Stream</span>
                    </div>
                    
                    <div th:id="'chart_container_' + ${stat.index}" class="h-[400px] w-full"></div>

                    <script th:inline="javascript">
                        (function() {
                            const symbol = /*[[${symbol}]]*/ 'AAPL';
                            const containerId = /*[['chart_container_' + ${stat.index}]]*/ '';
                            
                            function createWidget() {
                                if (window.TradingView) {
                                    new TradingView.widget({
                                        "width": "100%",
                                        "height": "100%",
                                        "symbol": symbol,
                                        "interval": "D",
                                        "timezone": "Etc/UTC",
                                        "theme": "dark",
                                        "style": "1",
                                        "locale": "kr",
                                        "toolbar_bg": "#0f172a",
                                        "enable_publishing": false,
                                        "hide_top_toolbar": false,
                                        "allow_symbol_change": true,
                                        "save_image": false,
                                        "container_id": containerId
                                    });
                                }
                            }
                            // 시차 로딩으로 브라우저 부하 분산
                            setTimeout(createWidget, 200 * /*[[${stat.index}]]*/ 0);
                        })();
                    </script>
                </div>
            </div>
        </div>
    </div>
</div>
