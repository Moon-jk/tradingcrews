spring.application.name=stock-console
spring.main.web-application-type=servlet
server.port=8090

# 스프링 코덱의 인메모리 버퍼 크기를 10MB로 설정
spring.codec.max-in-memory-size=10MB

# [API Key] (보안을 위해 환경 변수 사용 권장)
finnhub.api.key=${APP_FINNHUB_KEY}
# Groq API Key
groq.api.key=${APP_GROQ_KEY}

# Render 배포 시 이 우선순위를 강제합니다. (로컬에서는 env.properties 사용)
spring.config.import=optional:configtree:/etc/secrets/,optional:file:./env.properties,optional:file:../env.properties,optional:file:stock-console/env.properties

# 기본 연결 설정
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://dpg-d61kk1ggjchc73fm0m5g-a.singapore-postgres.render.com:5432/stock_lab}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:stock_lab_usr}
# 평문 노출 방지를 위해 기본값 제거 (인라인 주석 불가 - 별도 줄로 분리)
spring.datasource.password=${APP_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# [커넥션 풀 설정] 로컬 DB가 없어도 서버 기동이 멈추지 않게 함
spring.datasource.hikari.initialization-fail-timeout=0

# ==========================================
# JPA & Hibernate Settings
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# 세션 에러 방지 (이게 없으면 배포 시 또 에러 날 수 있음)
spring.session.store-type=none
# [JDBC 세션 자동 설정 끄기]
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
spring.sql.init.mode=never

# 🔒 [보안] Actuator 엔드포인트 제한 (health만 노출)
management.endpoints.web.exposure.include=health
management.endpoint.env.enabled=false
management.endpoint.beans.enabled=false


# ===============================================================================================================

# 한국투자증권 API 설정 (보안을 위해 환경 변수 사용)
kis.app-key=${APP_KIS_KEY}
kis.app-secret=${APP_KIS_SECRET}

# 모의투자용 키를 발급받았다면 true, 실전투자용 키라면 false
kis.mock=true

# OAuth2 Google Login
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email



